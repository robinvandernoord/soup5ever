[package]
name = "soup5ever"
version = "0.0.0"
edition = "2024"
publish = false
license = "MIT"
description = "Rust html5ever tree builder for BeautifulSoup 4 (Python extension; not published on crates.io)"

[lib]
name = "_soup5ever"
crate-type = ["cdylib"]

[dependencies]
html5ever = "0.40"
encoding_rs = "0.8"
pyo3 = "0.29"

[features]
default = ["abi3"]
# One wheel per platform for CPython >= 3.10 (the stable ABI). Disable with
# --no-default-features for a version-specific build (e.g. free-threaded).
abi3 = ["pyo3/abi3-py310"]

[profile.release]
lto = true          # Enable link-time optimization
codegen-units = 1   # Reduce number of codegen units to increase optimizations
strip = true        # Strip symbols from the binary
# No `panic = "abort"`: in an extension module PyO3 turns a Rust panic into a
# Python exception, while abort would kill the user's interpreter.
