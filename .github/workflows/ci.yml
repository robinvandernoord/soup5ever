name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONUNBUFFERED: "1"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --release

  # Build from source and run the full suite (BS4 contract, html5lib-tests,
  # differential corpus, property tests).
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - { os: macos-latest, python: "3.10" }
          - { os: macos-latest, python: "3.14" }
          - { os: windows-latest, python: "3.10" }
          - { os: windows-latest, python: "3.14" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install ".[test]"
      - run: python scripts/fetch_html5lib_tests.py
      - run: python -m pytest

  # The BS4 builder contract as each supported BeautifulSoup release defines
  # it: the smoke tests are re-synced from that release's sdist.
  bs4-versions:
    name: bs4 ${{ matrix.bs4 }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        bs4: ["4.13.1", "4.14.3", "latest"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
      - run: pip install ".[test]"
      - if: matrix.bs4 != 'latest'
        run: pip install "beautifulsoup4==${{ matrix.bs4 }}"
      - if: matrix.bs4 == 'latest'
        run: pip install --upgrade beautifulsoup4
      - run: python scripts/sync_bs4_tests.py
      - run: python scripts/fetch_html5lib_tests.py
      - run: python -m pytest

  # One abi3 wheel per platform covers CPython 3.10+.
  wheels:
    name: wheel (${{ matrix.target }}, ${{ matrix.manylinux || matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64, manylinux: "2_17" }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: "2_17" }
          - { os: ubuntu-latest, target: x86_64, manylinux: musllinux_1_2 }
          - { os: ubuntu-24.04-arm, target: aarch64, manylinux: musllinux_1_2 }
          - { os: macos-15-intel, target: x86_64 }
          - { os: macos-latest, target: aarch64 }
          - { os: windows-latest, target: x64 }
          - { os: windows-11-arm, target: aarch64 }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux || 'auto' }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheel-${{ matrix.os }}-${{ matrix.target }}-${{ matrix.manylinux || 'native' }}
          path: dist/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: sdist
          path: dist/*.tar.gz

  # Install the built wheels (no Rust toolchain on the path) and run the
  # suite against them, on the oldest and newest supported Python.
  test-wheels:
    name: test wheel (${{ matrix.os }}, py${{ matrix.python }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-latest
          - windows-latest
          - windows-11-arm
        python: ["3.10", "3.14"]
        exclude:
          # No CPython 3.10 build for Windows on ARM.
          - { os: windows-11-arm, python: "3.10" }
        include:
          - { os: windows-11-arm, python: "3.12" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          allow-prereleases: true
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Install wheel
        shell: bash
        run: |
          pip install --only-binary soup5ever --no-index --find-links dist soup5ever
          pip install "soup5ever[test]" --find-links dist
          python -c "import soup5ever, bs4; print(soup5ever.__version__, bs4.__version__)"
      - run: python scripts/fetch_html5lib_tests.py
      - name: Test against the installed wheel
        shell: bash
        run: |
          # Make sure the source tree can't shadow the installed package.
          rm -rf python
          python -m pytest

  # musl wheels are tested in an Alpine container, started with `docker run`
  # because JavaScript actions don't run inside Alpine on ARM runners.
  test-musllinux-wheels:
    name: test wheel (musllinux, ${{ matrix.os }})
    needs: wheels
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true
      - name: Test in Alpine
        run: |
          docker run --rm -v "$PWD:/io" -w /io python:3.13-alpine sh -euxc '
            apk add --no-cache git
            pip install --only-binary soup5ever --no-index --find-links dist soup5ever
            pip install "soup5ever[test]" --find-links dist
            python scripts/fetch_html5lib_tests.py
            rm -rf python
            python -m pytest
          '

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, rust, test, bs4-versions, test-wheels, test-musllinux-wheels, sdist]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
